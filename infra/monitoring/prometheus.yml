# Prometheus lokal untuk EraPay (opsional di dev, aktif di pilot).
# Jalankan: docker compose -f infra/compose/docker-compose.monitoring.yml up -d
# PRD NFR §8: rate, latency, error, gateway latency/error per gateway, webhook success/retry.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"

alerting:
  alertmanagers: []

scrape_configs:
  - job_name: "erapay-api"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          env: "development"
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "go_.*|process_.*"
        action: drop
