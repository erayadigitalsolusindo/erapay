# Local development stack: PostgreSQL, Redis, MinIO, and EraPay API.
# Usage:
#   docker compose -f infra/compose/docker-compose.yml up -d
#   # API will be available at http://localhost:8080/readyz
#
# With monitoring (Prometheus + Grafana):
#   docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.monitoring.yml up -d
#   # Prometheus at http://localhost:9090, Grafana at http://localhost:3000 (admin/erapay_dev_only)

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: erapay
      POSTGRES_PASSWORD: erapay_dev_only
      POSTGRES_DB: erapay
    ports: ["${ERAPAY_PG_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erapay"]
      interval: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: erapay_dev
      MINIO_ROOT_PASSWORD: erapay_dev_only
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5
      start_period: 10s

  # EraPay API (built from local source via `make api` or `go run ./cmd/api` on host).
  # To run inside Docker instead, add a Dockerfile and uncomment this service.
  # api:
  #   build:
  #     context: ../../services/api
  #     dockerfile: Dockerfile
  #   environment:
  #     ERAPAY_DATABASE_URL: postgres://erapay:erapay_dev_only@postgres:5432/erapay?sslmode=disable
  #     ERAPAY_REDIS_URL: redis://redis:6379/0
  #     ERAPAY_HTTP_ADDR: ":8080"
  #     ERAPAY_ENV: development
  #   ports: ["8080:8080"]
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   healthcheck:
  #     test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
  #     interval: 10s
  #     retries: 5
  #     start_period: 10s

volumes:
  pgdata:
  redisdata:
  miniodata: